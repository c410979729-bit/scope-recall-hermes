name: Hermes catalog install

# A fresh Hermes on Linux and macOS installs Scope Recall the way the plugin catalog does, runs setup, and is checked
# for recall in a new session and a correction against a loopback model. A second profile then uses the same store
# as a remote entry through the public remote commands, checked for recall both ways and replay after an outage.
# Runs when the Hermes install path or the remote entry path changes, and on demand.
# During development the catalog manifest pins a released core, testing the installation offered by the default branch.
# On a release PR it pins the new version, supplied by WHEELS.
on:
  pull_request:
    paths:
      - "distribution/hermes/**"
      - "adapters/hermes/**"
      - "adapters/clients/**"
      - "adapters/codex/remote_server.py"
      - "adapters/host_identity.py"
      - "adapters/host_profiles.py"
      - "adapters/installation.py"
      - "adapters/runtime_wiring.py"
      - "adapters/shared_entries.py"
      - "host_registry.py"
      - "maintenance/install_remote.py"
      - "maintenance/install_hermes.py"
      - "maintenance/shared.py"
      - ".github/scripts/hermes_remote_install.py"
      - "packaging/v11-module-allowlist.json"
      - "pyproject.toml"
      - "maintenance/setup*.py"
      - "maintenance/onboarding.py"
      - "maintenance/hermes_config.py"
      - ".github/workflows/hermes-catalog-install.yml"
      - ".github/scripts/hermes_catalog_install.sh"
      - ".github/scripts/loopback_chat_model.py"
      - "scripts/hermes_surface.py"
      - "fixtures/hermes/**"
  schedule:
    - cron: "23 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    name: hermes-catalog-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Build the core wheel the plugin pins
        run: python -m pip wheel . --no-deps --wheel-dir "$RUNNER_TEMP/wheels"
      - name: Install Hermes and the plugin, then check setup, recall and a correction
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          WHEELS: ${{ runner.temp }}/wheels
        run: bash .github/scripts/hermes_catalog_install.sh
      - name: Check two real Hermes homes over the remote entry
        env:
          WHEELS: ${{ runner.temp }}/wheels
        run: python .github/scripts/hermes_remote_install.py
      - name: Compare the installed Hermes source with the reviewed inventory
        if: always()
        env:
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          # install.sh defaults to HERMES_HOME/hermes-agent; the install step
          # overrides HOME within its own shell, so reconstruct that same home.
          home="$RUNNER_TEMP/hermes-catalog-install/home"
          root="${HERMES_INSTALL_DIR:-${HERMES_HOME:-$home/.hermes}/hermes-agent}"
          if [[ ! -f "$root/run_agent.py" || ! -f "$root/hermes_cli/plugins.py" || ! -f "$root/agent/memory_provider.py" ]]; then
            printf 'Hermes source was not found. Searched: %s\nExpected run_agent.py, hermes_cli/plugins.py and agent/memory_provider.py.\n' "$root" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 2
          fi
          output="$RUNNER_TEMP/hermes-surface-diff.txt"
          status=0
          python scripts/hermes_surface.py diff fixtures/hermes/surface-0.23.0.json "$root" > "$output" 2>&1 || status=$?
          cat "$output"
          {
            printf '### Hermes source surface\n\n```text\n'
            cat "$output"
            printf '\n```\n'
          } >> "$GITHUB_STEP_SUMMARY"
          # Default diff fails only for missing dependencies or stale inventories.
          # Pull requests report those findings while retaining input failures.
          if [[ "$status" -eq 1 && "$EVENT_NAME" == "pull_request" ]]; then
            exit 0
          fi
          exit "$status"
