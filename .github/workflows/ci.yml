name: CI

# A change set runs this workflow once, on its pull request.  Main is
# fast-forwarded to the tested head, so the release gate finds ci-required on
# the commit it tags and a push to main does not repeat the suite.  A newer
# push to the same pull request cancels the run it supersedes.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  test:
    name: ${{ matrix.os }}-${{ matrix.tier }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # Each layer runs its own tier: integration selects a shared
        # baseline and does not replace the layer-specific test sets.
        tier: [unit, contract, storage, capture, claims, deletion, episodes, retrieval, packaging, migration]
        # Host and native process checks run on Windows. Host includes
        # Task Scheduler paths; native requires LanceDB. Linux and macOS
        # coverage for these process tiers needs its own validation.
        include:
          - os: windows-latest
            tier: host
          - os: windows-latest
            tier: native
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        env:
          PIP_CONSTRAINT: constraints/release.txt
        run: python -m pip install ".[lancedb,codex,dev]" uv
      - name: Record SQLite capabilities
        # This records the standard-library build the tier actually uses.
        # A missing extension capability is data, not a probe-job failure.
        run: python tests/public_bench/probe_sqlite.py
      - name: Run tier (no implicit retries)
        run: python scripts/check.py --tier ${{ matrix.tier }} --task P17

  # The in-process tiers cover both ends of the supported Python range on
  # each platform to catch parser and standard-library differences. The
  # process tiers use the shared interpreter configured above.
  test-python-range:
    name: ${{ matrix.os }}-py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install test dependencies
        env:
          PIP_CONSTRAINT: constraints/release.txt
        run: python -m pip install ".[lancedb,codex,dev]" uv
      - name: Record SQLite capabilities
        run: python tests/public_bench/probe_sqlite.py
      - name: Run the in-process tiers (no implicit retries)
        shell: bash
        run: |
          failed=""
          for tier in unit contract storage capture claims deletion episodes retrieval; do
            python scripts/check.py --tier "${tier}" --task P17 || failed="${failed} ${tier}"
          done
          test -z "${failed}" || { echo "failed tiers:${failed}"; exit 1; }

  # Formatting, lint and type findings, held to scripts/quality.baseline.json
  # (no file may gain findings of a rule, no function may grow past its size).  The environment comes from uv.lock, which
  # pins the ruff and pyright versions and the packages pyright reads, so a
  # contributor's `uv run python scripts/quality.py` sees what this sees.
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install uv
        run: python -m pip install uv
      - name: Make the environment from the lock
        run: uv sync --locked --no-editable --extra lancedb --extra codex --extra dev --python 3.12
      - name: Check formatting, lint and types against the baseline
        run: uv run --no-sync python scripts/quality.py

  # The integration baseline takes 35 to 45 minutes on a Windows runner, so it
  # runs where the change is made, before the pull request opens
  # (CONTRIBUTING.md), and here only when the workflow is dispatched by hand.
  # Host and native run on every pull request in the matrix above.
  windows-integration:
    name: windows-integration
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Windows dependencies
        env:
          PIP_CONSTRAINT: constraints/release.txt
        run: python -m pip install ".[lancedb,codex,dev]" uv
      - name: Record SQLite capabilities
        run: python tests/public_bench/probe_sqlite.py
      - name: Run the integration tier (no implicit retries)
        run: python scripts/check.py --tier integration --task P17

  ci-required:
    name: ci-required
    # A run cancelled by a newer push reports nothing for the head it superseded.
    if: ${{ !cancelled() }}
    permissions: {}
    needs:
      - test
      - test-python-range
      - lint
      - windows-integration
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI dependency to succeed
        run: |
          test "${{ needs.test.result }}" = "success"
          test "${{ needs.test-python-range.result }}" = "success"
          test "${{ needs.lint.result }}" = "success"
          test "${{ needs.windows-integration.result }}" = "${{ github.event_name == 'workflow_dispatch' && 'success' || 'skipped' }}"
